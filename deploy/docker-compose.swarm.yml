# docker-compose.swarm.yml — GomeBoy web emulator stack for swarm deploy.
#
# Built for the image produced by the repository-root Dockerfile (SWARM-1).
# Deploy (SWARM-3, only after a human confirms the open questions below):
#   docker stack deploy -c deploy/docker-compose.swarm.yml gomeboy
# or via the swarmpit-prod MCP tools (create_stack_file / create_stack).
#
# OPEN QUESTION 1 — SAVE PERSISTENCE (NOT DECIDED HERE):
#   GomeBoy writes .sav/.state files via internal/gameboy WithSaveDir; with no
#   save dir set they land beside the ROM / in the container CWD. This stack
#   mounts a named volume at /roms for the ROM only. Do spectator saves need
#   to survive container restarts? If yes, the first deployer must add a
#   persistent mount for the save output before deploying. Deliberate call,
#   not a default.
#
# OPEN QUESTION 2 — INGRESS/TLS (NOT DECIDED HERE):
#   No reverse-proxy service and no ingress labels are defined here. The
#   existing swarmpit-prod stacks use a specific ingress pattern (e.g. Traefik
#   labels) that could not be confirmed in this task — the swarmpit-prod MCP
#   was not available to inspect existing stacks. Before exposing port 8090
#   beyond the swarm nodes, list the existing stacks and add the matching
#   labels so this stack matches the existing ingress setup.

version: "3.8"

services:
  gomeboy-web:
    # Placeholder tag: the actual registry/tag naming is an operational
    # decision made at deploy time via swarmpit-prod, not hardcoded here.
    # Every swarm node must be able to pull this image (build locally on each
    # node, or push to a registry all nodes can reach — see deploy/README.md).
    image: gomeboy-web:latest
    # The image ENTRYPOINT is /gomeboy-web with no CMD, so the ROM path is
    # supplied here. Drop the ROM file into the named volume below; the
    # filename must match what is actually in the volume.
    command: ["-rom", "/roms/pokemon_red.gb"]
    ports:
      - "8090:8090"
    volumes:
      # Parent directory of the ROM, not a single file: any ROM dropped into
      # this named volume is usable without rebuilding the image.
      - roms:/roms
    deploy:
      # Stateful / single-writer emulator: exactly one replica. Do not raise.
      replicas: 1
      restart_policy:
        # A crashed emulator instance should restart, but not hammer the host
        # in a crash loop: on-failure with a 5s delay.
        condition: on-failure
        delay: 5s

volumes:
  roms:

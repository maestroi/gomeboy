name: Apply agent debug tooling

on:
  push:
    branches:
      - feat/agent-debug-tooling

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-debug-tooling
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Wire tooling into public emulator
        run: python3 tools/apply_agent_debug_tooling.py
      - name: Format
        run: gofmt -w pkg/gomeboy/gomeboy.go internal/cpu/debug.go internal/gameboy/debug.go internal/ppu/debug.go pkg/gomeboy/debug.go pkg/gomeboy/rununtil.go pkg/gomeboy/memory_tracker.go pkg/gomeboy/input_timeline.go pkg/gomeboy/flight_recorder.go pkg/gomeboy/fork.go pkg/gomeboy/checked_state.go pkg/gomeboy/state_hash.go pkg/gomeboy/agent_features_test.go
      - name: Focused self-contained tests
        run: >-
          go test ./pkg/gomeboy
          -run '^(TestDebuggerStepAndState|TestConditionsAndRunUntil|TestMemoryTracker|TestFlightRecorderAndInputRecording|TestInputReplayIsDeterministic|TestForkIsIndependent|TestCheckedStateMetadataAndValidation|TestStateHashIgnoresFramebufferOutput|TestWithoutVideoMatchesExecutionState|TestCheckpointRestore|TestReadIntoMatchesRead)$'
      - name: Compile touched internal packages
        run: go test ./internal/cpu ./internal/gameboy ./internal/ppu -run '^$'
      - name: Diff check
        run: git diff --check
      - name: Commit wired implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/gomeboy/gomeboy.go internal/cpu/debug.go internal/gameboy/debug.go internal/ppu/debug.go pkg/gomeboy/debug.go pkg/gomeboy/rununtil.go pkg/gomeboy/memory_tracker.go pkg/gomeboy/input_timeline.go pkg/gomeboy/flight_recorder.go pkg/gomeboy/fork.go pkg/gomeboy/checked_state.go pkg/gomeboy/state_hash.go pkg/gomeboy/agent_features_test.go
          git commit -m "feat: wire agent debugging tooling"
          git push origin HEAD:feat/agent-debug-tooling

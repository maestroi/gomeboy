name: implement agent fast paths

on:
  push:
    branches:
      - perf/agent-fastpaths-video-checkpoints

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v7
        with:
          ref: perf/agent-fastpaths-video-checkpoints
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: patch core fast paths
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          ppu_path = Path("internal/ppu/ppu.go")
          ppu = ppu_path.read_text()
          old = "\t// Frame buffers\n\tPreparedFrame [ScreenHeight][ScreenWidth][3]uint8\n"
          new = "\t// Frame buffers\n\tvideoOutput  bool\n\tPreparedFrame [ScreenHeight][ScreenWidth][3]uint8\n"
          if ppu.count(old) != 1:
              raise SystemExit("ppu.go: frame buffer field anchor not found exactly once")
          ppu = ppu.replace(old, new, 1)

          old = "\t\tbgFIFO:  utils.NewFIFO[FIFOEntry](8),\n\t\tobjFIFO: utils.NewFIFO[FIFOEntry](8),\n"
          new = "\t\tbgFIFO:      utils.NewFIFO[FIFOEntry](8),\n\t\tobjFIFO:     utils.NewFIFO[FIFOEntry](8),\n\t\tvideoOutput: true,\n"
          if ppu.count(old) != 1:
              raise SystemExit("ppu.go: New() FIFO anchor not found exactly once")
          ppu = ppu.replace(old, new, 1)

          new_push = r'''func (p *PPU) pushPixel() {
	if !p.canPopBG() {
		return
	}

	// FIFO consumption and LX progression are hardware-visible simulation state,
	// so they always happen even when RGB output is disabled.
	bgPX := p.bgFIFO.Pop()
	var objPX *FIFOEntry
	if p.objFIFO.Size > 0 {
		objPX = p.objFIFO.Pop()
	}

	// are we adjusting for horizontal scroll?
	if p.scxToDiscard > p.scxDiscarded {
		p.scxDiscarded++
		return
	}

	// are we currently offscreen? (pixels are simply discarded)
	if p.lx < 8 {
		p.lx++
		return
	}

	// Agent/test workloads often need exact PPU timing and memory side effects
	// without materialising an RGB framebuffer. Skip only colour composition and
	// the framebuffer write; all fetch/FIFO/timing state above remains exact.
	if !p.videoOutput {
		p.lx++
		return
	}

	var color [3]uint8
	bgPriority := bgPX.Attributes&types.Bit7 > 0
	drawObject := false
	bgEnabled := true

	if objPX != nil && objPX.Color > 0 && p.objEnabled {
		color = p.ColourOBJPalette[objPX.Palette][objPX.Color]
		drawObject = true
		if objPX.Attributes&types.Bit7 > 0 {
			bgPriority = true
		}
	}

	// BG_EN bit is different on CGB
	if !p.bgEnabled {
		if p.cgbMode {
			bgPriority = false
		} else {
			bgEnabled = false
		}
	}

	if !drawObject || bgPriority && bgPX.Color > 0 {
		// are we drawing a BG pixel?
		if bgEnabled {
			if (p.winTriggerWx && !p.Debug.WindowDisabled) || (!p.winTriggerWx && !p.Debug.BackgroundDisabled) {
				color = p.ColourPalette[bgPX.Attributes&7][bgPX.Color]
			} else {
				// user has disabled rendering through debugging functions
				color = [3]uint8{0xff, 0xff, 0xff} // white TODO customizable disabled color
			}
		} else {
			color = p.ColourPalette[bgPX.Attributes&7][0]
		}
	}

	p.PreparedFrame[p.ly][p.lx-8] = color
	p.lx++
}
'''
          pattern = r'func \(p \*PPU\) pushPixel\(\) \{.*?\n\}\n\n// FetcherState'
          ppu, n = re.subn(pattern, new_push + "\n// FetcherState", ppu, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"ppu.go: pushPixel replacement count={n}")

          marker = "func (p *PPU) renderBlank() {\n"
          if ppu.count(marker) != 1:
              raise SystemExit(f"ppu.go: renderBlank marker count={ppu.count(marker)}")
          ppu = ppu.replace(marker, marker + "\tif !p.videoOutput {\n\t\treturn\n\t}\n\n", 1)
          ppu_path.write_text(ppu)

          replace_once(
              "internal/ppu/state.go",
              "\tp.objBuffer = append([]Object(nil), s.ObjBuffer...)\n",
              "\tp.objBuffer = append(p.objBuffer[:0], s.ObjBuffer...)\n",
          )

          apu_path = Path("internal/apu/state.go")
          apu = apu_path.read_text()
          old = '''\tbufLen := bufferSize
\tif l := len(s.Buffer); l > bufLen {
\t\tbufLen = l
\t}
\ta.buffer = make([]float32, bufLen)
\tcopy(a.buffer, s.Buffer)
\ta.bufferPos = s.BufferPos
\ta.lastCatchup = s.LastCatchup
\ta.mute = s.Mute
\ta.headless = s.Headless
\ta.capacitors = s.Capacitors
\tif a.headless {
\t\ta.buffer = nil
\t\ta.bufferPos = 0
\t}
'''
          new = '''\ta.lastCatchup = s.LastCatchup
\ta.mute = s.Mute
\ta.headless = s.Headless
\ta.capacitors = s.Capacitors
\tif a.headless {
\t\ta.buffer = nil
\t\ta.bufferPos = 0
\t} else {
\t\tbufLen := bufferSize
\t\tif l := len(s.Buffer); l > bufLen {
\t\t\tbufLen = l
\t\t}
\t\tif cap(a.buffer) < bufLen {
\t\t\ta.buffer = make([]float32, bufLen)
\t\t} else {
\t\t\ta.buffer = a.buffer[:bufLen]
\t\t\tclear(a.buffer)
\t\t}
\t\tcopy(a.buffer, s.Buffer)
\t\ta.bufferPos = s.BufferPos
\t}
'''
          if apu.count(old) != 1:
              raise SystemExit("apu/state.go: restore buffer block not found exactly once")
          apu_path.write_text(apu.replace(old, new, 1))

          replace_once(
              "pkg/gomeboy/gomeboy.go",
              "\theadless bool\n\tsaveDir  string\n",
              "\theadless bool\n\tnoVideo  bool\n\tsaveDir  string\n",
          )
          replace_once(
              "pkg/gomeboy/gomeboy.go",
              '''func Headless() Option {
\treturn func(c *config) { c.headless = true }
}
''',
              '''func Headless() Option {
\treturn func(c *config) { c.headless = true }
}

// WithoutVideo disables RGB framebuffer composition while preserving exact
// PPU timing, FIFO progression, interrupts, DMA behaviour, and memory state.
// Frame() is not updated while video output is disabled.
func WithoutVideo() Option {
\treturn func(c *config) { c.noVideo = true }
}
''',
          )
          replace_once(
              "pkg/gomeboy/gomeboy.go",
              '''\tif cfg.saves {
\t\tgbOpts = append(gbOpts, gameboy.WithSaveDir(cfg.saveDir))
\t} else {
\t\tgbOpts = append(gbOpts, gameboy.WithoutSaves())
\t}

\te := &Emulator{gb: gameboy.NewGameBoy(gbOpts...)}
''',
              '''\tif cfg.saves {
\t\tgbOpts = append(gbOpts, gameboy.WithSaveDir(cfg.saveDir))
\t} else {
\t\tgbOpts = append(gbOpts, gameboy.WithoutSaves())
\t}
\tif cfg.noVideo {
\t\tgbOpts = append(gbOpts, gameboy.WithVideoOutput(false))
\t}

\te := &Emulator{gb: gameboy.NewGameBoy(gbOpts...)}
''',
          )
          PY

          cat > internal/ppu/video_output.go <<'EOF'
          package ppu

          // SetVideoOutput controls RGB framebuffer composition. Disabling it
          // does not skip PPU timing, FIFO work, interrupts, bus locks, or DMA.
          func (p *PPU) SetVideoOutput(enabled bool) {
          	p.videoOutput = enabled
          }

          // VideoOutputEnabled reports whether RGB framebuffer composition is enabled.
          func (p *PPU) VideoOutputEnabled() bool {
          	return p.videoOutput
          }
          EOF

          cat > internal/gameboy/video_output.go <<'EOF'
          package gameboy

          // WithVideoOutput controls whether the PPU materialises RGB pixels.
          // PPU simulation remains cycle/timing accurate when output is disabled.
          func WithVideoOutput(enabled bool) Opt {
          	return func(g *GameBoy) {
          		g.PPU.SetVideoOutput(enabled)
          	}
          }
          EOF

          cat > internal/io/checkpoint.go <<'EOF'
          package io

          // SnapshotInto captures cartridge state into dst while reusing its RAM
          // storage across repeated checkpoints.
          func (c *Cartridge) SnapshotInto(dst *CartridgeState) {
          	ram := dst.RAM
          	camera := dst.Camera
          	*dst = CartridgeState{}
          	if cap(ram) < len(c.RAM) {
          		ram = make([]byte, len(c.RAM))
          	} else {
          		ram = ram[:len(c.RAM)]
          	}
          	copy(ram, c.RAM)
          	dst.RAM = ram
          	dst.RAMEnabled = c.ramEnabled
          	dst.ROMOffset = c.romOffset
          	dst.RAMOffset = c.ramOffset
          	dst.MBC1.BankShift = c.mbc1.bankShift
          	dst.MBC1.Bank1 = c.mbc1.bank1
          	dst.MBC1.Bank2 = c.mbc1.bank2
          	dst.MBC1.Mode = c.mbc1.mode
          	dst.M161Latched = c.m161Latched
          	dst.MBC7.LatchReady = c.mbc7.latchReady
          	dst.MBC7.RAMEnabled = c.mbc7.ramEnabled
          	dst.MBC7.XLatch = c.mbc7.xLatch
          	dst.MBC7.YLatch = c.mbc7.yLatch
          	dst.MBC7.Eeprom.DO = c.mbc7.eeprom.do
          	dst.MBC7.Eeprom.DI = c.mbc7.eeprom.di
          	dst.MBC7.Eeprom.CLK = c.mbc7.eeprom.clk
          	dst.MBC7.Eeprom.CS = c.mbc7.eeprom.cs
          	dst.MBC7.Eeprom.WriteEnabled = c.mbc7.eeprom.writeEnabled
          	dst.MBC7.Eeprom.Command = c.mbc7.eeprom.command
          	dst.MBC7.Eeprom.BitsIn = c.mbc7.eeprom.bitsIn
          	dst.MBC7.Eeprom.BitsOut = c.mbc7.eeprom.bitsOut
          	dst.MBC7.Eeprom.BitsLeft = c.mbc7.eeprom.bitsLeft
          	dst.HUC1.IRMode = c.huc1.irMode
          	dst.RTC.Enabled = c.rtc.enabled
          	dst.RTC.Latched = c.rtc.latched
          	dst.RTC.Latching = c.rtc.latching
          	dst.RTC.Register = c.rtc.register
          	dst.RTC.LastUpdate = c.rtc.lastUpdate
          	dst.RTC.HeldTicks = c.rtc.heldTicks
          	dst.AccelerometerX = c.AccelerometerX
          	dst.AccelerometerY = c.AccelerometerY
          	if c.Camera != nil {
          		if camera == nil {
          			camera = &CameraState{}
          		}
          		camera.Registers = c.Camera.Registers
          		camera.RegistersMapped = c.Camera.registersMapped
          		dst.Camera = camera
          	}
          }

          // SnapshotInto captures bus state into dst while preserving reusable
          // cartridge checkpoint storage.
          func (b *Bus) SnapshotInto(dst *State) {
          	cartridge := dst.Cartridge
          	*dst = State{
          		Data:            b.data,
          		WRAM:            b.wRAM,
          		VRAM:            b.VRAM,
          		ButtonState:     b.buttonState,
          		IME:             b.ime,
          		BootROMDone:     b.bootROMDone,
          		VRAMBankMask:    b.vRAMBankMask,
          		Model:           b.model,
          		IsGBC:           b.isGBC,
          		DMASource:       b.dmaSource,
          		DMADestination:  b.dmaDestination,
          		DMAActive:       b.dmaActive,
          		DMARestarting:   b.dmaRestarting,
          		DMAConflict:     b.dmaConflict,
          		DMAEnabled:      b.dmaEnabled,
          		RegionLocks:     b.regionLocks,
          		DMAConflicted:   b.dmaConflicted,
          		HDMASource:      b.hdmaSource,
          		HDMADestination: b.hdmaDestination,
          		DMALength:       b.dmaLength,
          		DMARemaining:    b.dmaRemaining,
          		DMAComplete:     b.dmaComplete,
          		DMAPaused:       b.dmaPaused,
          	}
          	dst.Cartridge = cartridge
          	b.c.SnapshotInto(&dst.Cartridge)
          }
          EOF

          cat > internal/ppu/checkpoint.go <<'EOF'
          package ppu

          // SnapshotInto captures PPU state into dst while reusing the scanline
          // object buffer used by repeated in-process checkpoints.
          func (p *PPU) SnapshotInto(dst *State) {

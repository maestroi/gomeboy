          func BenchmarkPerfRestoreCheckpoint(b *testing.B) {
          	e := newAgentPerfEmulator(b, true)
          	defer e.Close()
          	var cp Checkpoint
          	e.CheckpointInto(&cp)
          	if err := e.RestoreCheckpoint(&cp); err != nil {
          		b.Fatal(err)
          	}
          	b.ReportAllocs()
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		if err := e.RestoreCheckpoint(&cp); err != nil {
          			b.Fatal(err)
          		}
          	}
          }

          func BenchmarkPerfLoadState(b *testing.B) {
          	e := newAgentPerfEmulator(b, true)
          	defer e.Close()
          	state, err := e.SaveState()
          	if err != nil {
          		b.Fatal(err)
          	}
          	b.ReportAllocs()
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		if err := e.LoadState(state); err != nil {
          			b.Fatal(err)
          		}
          	}
          }

          func BenchmarkPerfReadInto4K(b *testing.B) {
          	e := newAgentPerfEmulator(b, true)
          	defer e.Close()
          	dst := make([]byte, 4096)
          	b.ReportAllocs()
          	b.ResetTimer()
          	for i := 0; i < b.N; i++ {
          		e.ReadInto(0xC000, dst)
          	}
          }
          EOF
      - name: format
        run: gofmt -w internal/ppu/ppu.go internal/ppu/state.go internal/ppu/video_output.go internal/ppu/checkpoint.go internal/apu/state.go internal/io/checkpoint.go internal/gameboy/video_output.go internal/gameboy/checkpoint.go pkg/gomeboy/gomeboy.go pkg/gomeboy/checkpoint.go pkg/gomeboy/read_into.go pkg/gomeboy/agent_fastpaths_test.go pkg/gomeboy/agent_fastpaths_bench_test.go
      - name: focused tests
        run: go test ./internal/ppu ./internal/apu ./internal/io ./internal/gameboy ./pkg/gomeboy
      - name: regression tests
        run: go test -tags test ./tests -run Test_Regressions
      - name: benchmark agent fast paths
        run: go test ./pkg/gomeboy -run '^$' -bench '^BenchmarkPerf(StepFrameHeadless(Video|NoVideo)|StepFrames60Headless(Video|NoVideo)|CheckpointInto|SaveState|RestoreCheckpoint|LoadState|ReadInto4K)$' -benchmem -benchtime=1s -count=5
      - name: diff check
        run: git diff --check
      - name: commit implementation
        shell: bash
        run: |
          git config user.name 'gomeboy-perf-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add internal/ppu internal/apu/state.go internal/io/checkpoint.go internal/gameboy pkg/gomeboy
          git commit -m 'perf: add video suppression and reusable checkpoints'
          git push origin HEAD:perf/agent-fastpaths-video-checkpoints

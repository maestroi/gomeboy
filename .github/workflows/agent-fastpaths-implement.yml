          cat > internal/gameboy/checkpoint.go <<'EOF'
          package gameboy

          // CheckpointInto captures the complete execution state into dst while
          // reusing mutable snapshot storage where possible. It is intended for
          // high-frequency in-process branching; SaveState remains the portable
          // serialized format.
          func (g *GameBoy) CheckpointInto(dst *State) {
          	g.mu.Lock()
          	defer g.mu.Unlock()
          	dst.CPU = g.CPU.Snapshot()
          	dst.Scheduler = g.Scheduler.Snapshot()
          	g.Bus.SnapshotInto(&dst.Bus)
          	g.PPU.SnapshotInto(&dst.PPU)
          	dst.APU = g.APU.Snapshot()
          	dst.Timer = g.Timer.Snapshot()
          	dst.Serial = g.Serial.Snapshot()
          	dst.Model = g.model
          	dst.Frames = g.frames
          }
          EOF

          cat > pkg/gomeboy/checkpoint.go <<'EOF'
          package gomeboy

          import (
          	"errors"

          	"github.com/thelolagemann/gomeboy/internal/gameboy"
          )

          // Checkpoint is an opaque reusable in-memory emulator checkpoint.
          // Its zero value is ready to use as a CheckpointInto destination.
          // Unlike SaveState, it is not a stable or portable serialized format.
          type Checkpoint struct {
          	state gameboy.State
          	valid bool
          }

          // CheckpointInto captures the emulator into dst. Reusing the same
          // Checkpoint avoids serialization and reuses variable-sized snapshot
          // buffers after their first allocation.
          func (e *Emulator) CheckpointInto(dst *Checkpoint) {
          	if dst == nil {
          		panic("gomeboy: nil checkpoint destination")
          	}
          	e.gb.CheckpointInto(&dst.state)
          	dst.valid = true
          }

          // RestoreCheckpoint restores a checkpoint captured from an emulator
          // running the same ROM.
          func (e *Emulator) RestoreCheckpoint(src *Checkpoint) error {
          	if src == nil || !src.valid {
          		return errors.New("gomeboy: checkpoint is not initialized")
          	}
          	e.gb.Restore(src.state)
          	return nil
          }
          EOF

          cat > pkg/gomeboy/read_into.go <<'EOF'
          package gomeboy

          // ReadInto performs CPU-accurate reads into dst without allocating a
          // result slice. Reads wrap through the 16-bit address space exactly as
          // Read does.
          func (e *Emulator) ReadInto(addr uint16, dst []byte) {
          	for i := range dst {
          		dst[i] = e.gb.Bus.Read(addr + uint16(i))
          	}
          }
          EOF

          cat > pkg/gomeboy/agent_fastpaths_test.go <<'EOF'
          package gomeboy

          import (
          	"bytes"
          	"reflect"
          	"testing"
          )

          func newFastPathTestEmulator(t *testing.T, opts ...Option) *Emulator {
          	t.Helper()
          	all := []Option{WithROMBytes(perfROM())}
          	all = append(all, opts...)
          	e, err := New(all...)
          	if err != nil {
          		t.Fatalf("New: %v", err)
          	}
          	t.Cleanup(func() { _ = e.Close() })
          	return e
          }

          func TestWithoutVideoPreservesSimulationState(t *testing.T) {
          	video := newFastPathTestEmulator(t, Headless())
          	noVideo := newFastPathTestEmulator(t, Headless(), WithoutVideo())

          	video.StepFrames(30)
          	noVideo.StepFrames(30)

          	var a, b Checkpoint
          	video.CheckpointInto(&a)
          	noVideo.CheckpointInto(&b)
          	// The framebuffer is intentionally different when output is disabled;
          	// every other captured simulation field must remain identical.
          	a.state.PPU.PreparedFrame = [144][160][3]uint8{}
          	b.state.PPU.PreparedFrame = [144][160][3]uint8{}
          	if !reflect.DeepEqual(a.state, b.state) {
          		t.Fatal("video suppression changed emulation state")
          	}
          }

          func TestCheckpointRestoreRoundTrip(t *testing.T) {
          	e := newFastPathTestEmulator(t, Headless(), WithoutVideo())
          	e.StepFrames(5)

          	var cp Checkpoint
          	e.CheckpointInto(&cp)
          	before := e.SnapshotMemory()
          	cycle := e.Cycle()
          	frames := e.FrameCount()

          	e.Press(ButtonA)
          	e.StepFrames(7)
          	e.Release(ButtonA)

          	if err := e.RestoreCheckpoint(&cp); err != nil {
          		t.Fatalf("RestoreCheckpoint: %v", err)
          	}
          	after := e.SnapshotMemory()
          	if !bytes.Equal(before, after) {
          		t.Fatal("memory differs after checkpoint restore")
          	}
          	if got := e.Cycle(); got != cycle {
          		t.Fatalf("cycle=%d, want %d", got, cycle)
          	}
          	if got := e.FrameCount(); got != frames {
          		t.Fatalf("frames=%d, want %d", got, frames)
          	}
          }

          func TestReadIntoMatchesRead(t *testing.T) {
          	e := newFastPathTestEmulator(t, Headless(), WithoutVideo())
          	e.StepFrame()
          	want := e.Read(0xC000, 64)
          	got := make([]byte, len(want))
          	e.ReadInto(0xC000, got)
          	if !bytes.Equal(got, want) {
          		t.Fatalf("ReadInto mismatch: got %x want %x", got, want)
          	}
          }

          func TestRestoreUninitializedCheckpoint(t *testing.T) {
          	e := newFastPathTestEmulator(t, Headless())
          	var cp Checkpoint
          	if err := e.RestoreCheckpoint(&cp); err == nil {
          		t.Fatal("expected error restoring uninitialized checkpoint")
          	}
          }
          EOF

          cat > pkg/gomeboy/agent_fastpaths_bench_test.go <<'EOF'
          package gomeboy

          import "testing"

          func newAgentPerfEmulator(b *testing.B, noVideo bool) *Emulator {
          	b.Helper()
          	opts := []Option{WithROMBytes(perfROM()), Headless()}
          	if noVideo {
          		opts = append(opts, WithoutVideo())
          	}
          	e, err := New(opts...)
          	if err != nil {
          		b.Fatalf("New: %v", err)
          	}
          	for i := 0; i < 10; i++ {
          		e.StepFrame()
          	}
          	return e

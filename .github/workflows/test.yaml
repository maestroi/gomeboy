name: gomeboy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_library:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: extract test ROMs
        run: go test -tags test ./tests -run '^$'
      - name: test library, HLE boot, and agent tooling packages
        run: go test ./internal/apu ./internal/cpu ./internal/gb/... ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream ./cmd/gb-compat
      - name: benchmark optimized GBA whole-frame performance
        run: go test ./pkg/gomeboy -run '^$' -bench '^BenchmarkPerfGBAStepFrame(Headless|Audio)$' -benchmem -benchtime=250ms -count=2

  test_gba:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: test GBA core packages
        run: go test ./internal/gba/...
      - name: fetch pinned @rkanoid compatibility ROM
        run: bash tests/gba/compatibility/fetch-rkanoid.sh
      - name: build project multi-hardware compatibility ROM
        run: bash tests/gba/compatibility/build-multihw.sh
      - name: run GBA conformance smoke
        run: go run ./cmd/gba-conformance -manifest tests/gba/conformance/smoke.json -output gba-conformance.json -commit "$GITHUB_SHA"
      - name: fetch pinned mGBA hardware suite
        run: bash tests/gba/mgba-suite/fetch-suite.sh
      - name: run mGBA hardware conformance
        run: go run ./cmd/gba-mgba-suite -config tests/gba/mgba-suite/config.json -rom tests/gba/mgba-suite/roms/suite.gba -output gba-mgba-suite.json -markdown gba-mgba-suite.md -commit "$GITHUB_SHA"
      - name: run GBA compatibility smoke
        run: go run ./cmd/gba-compat -manifest tests/gba/compatibility/smoke.json -output gba-compatibility.json -markdown gba-compatibility.md -commit "$GITHUB_SHA"
      - name: fetch pinned jsmolka ARM/Thumb ROMs
        run: bash tests/gba/conformance/jsmolka/fetch.sh
      - name: run mandatory jsmolka ARM/Thumb conformance
        run: |
          status=0
          go run ./cmd/gba-conformance \
            -manifest tests/gba/conformance/jsmolka/suite.json \
            -output gba-conformance-jsmolka.json \
            -commit "$GITHUB_SHA" || status=$?
          cat gba-conformance-jsmolka.json
          exit "$status"
      - name: upload GBA conformance result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gba-conformance
          path: |
            gba-conformance.json
            gba-conformance-jsmolka.json
          if-no-files-found: ignore
      - name: upload mGBA hardware conformance result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gba-mgba-suite
          path: |
            gba-mgba-suite.json
            gba-mgba-suite.md
          if-no-files-found: ignore
      - name: upload GBA compatibility result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gba-compatibility
          path: |
            gba-compatibility.json
            gba-compatibility.md
          if-no-files-found: ignore

  memory_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: extract test ROMs
        run: go test -tags test ./tests -run '^$'
      - name: race detector
        env:
          GOMEBOY_MEMORY_STABILITY_FRAMES: '400'
        run: go test -race ./internal/gba/... ./internal/gb/... ./internal/apu ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream ./cmd/gb-compat
      - name: strict pointer checks
        env:
          GOMEBOY_MEMORY_STABILITY_FRAMES: '400'
        run: go test -gcflags=all=-d=checkptr=2 ./internal/gba/... ./internal/gb/... ./internal/apu ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream ./cmd/gb-compat

  test_regressions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: extract bundled GB/GBC test ROMs
        run: go test -tags test ./tests -run '^$'
      - name: fetch pinned AGE conformance corpus
        run: bash tests/fetch-age.sh
      - name: build pinned GB/GBC compatibility fixtures
        run: bash tests/gb/compatibility/build-fixtures.sh
      - name: run GB/GBC compatibility smoke
        run: go run ./cmd/gb-compat -manifest tests/gb/compatibility/smoke.json -output gb-gbc-compatibility.json -markdown gb-gbc-compatibility.md -commit "$GITHUB_SHA"
      - name: tests
        run: go test -tags test -v ./tests -run Test_Regressions
      - name: upload GB/GBC regression report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gb-gbc-regression
          path: |
            tests/regression-results.json
            tests/README.md
            tests/external-corpus.json
            gb-gbc-compatibility.json
            gb-gbc-compatibility.md
          if-no-files-found: ignore

  test_desktop_glfw:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libsdl2-dev
      - name: install dependencies
        run: go mod download
      - name: test desktop display packages
        run: go test ./pkg/display ./pkg/display/glfw

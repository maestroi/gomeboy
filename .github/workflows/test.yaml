name: gomeboy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test_library:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: extract test ROMs
        run: go test -tags test ./tests -run '^$'
      - name: test library and agent tooling packages
        run: go test ./internal/apu ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream

  memory_safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: extract test ROMs
        run: go test -tags test ./tests -run '^$'
      - name: race detector
        env:
          GOMEBOY_MEMORY_STABILITY_FRAMES: '400'
        run: go test -race ./internal/apu ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream
      - name: strict pointer checks
        env:
          GOMEBOY_MEMORY_STABILITY_FRAMES: '400'
        run: go test -gcflags=all=-d=checkptr=2 ./internal/apu ./pkg/gomeboy/... ./pkg/memprobe ./cmd/memprobe ./cmd/gomeboy-stream

  test_regressions:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install dependencies
        run: go mod download
      - name: tests
        run: go test -tags test -v ./tests -run Test_Regressions

  test_desktop_glfw:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libsdl2-dev
      - name: install dependencies
        run: go mod download
      - name: test desktop display packages
        run: go test ./pkg/display ./pkg/display/glfw

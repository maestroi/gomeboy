name: apply perf video checkpoints

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_and_benchmark:
    if: github.event.pull_request.head.ref == 'perf/video-checkpoints'
    runs-on: ubuntu-latest
    steps:
      - name: checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: perf/video-checkpoints
          fetch-depth: 0
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: apply implementation
        run: python3 tools/apply_perf_video_checkpoint.py
      - name: fix generated snapshot test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pkg/gomeboy/perf_features_test.go')
          s = p.read_text()
          s = s.replace(
              '\twantMemory := e.SnapshotMemory()\n',
              '\twantMemory := make([]byte, AddressSpaceSize)\n\te.PeekInto(0, wantMemory)\n',
          )
          s = s.replace(
              '\tif got := e.SnapshotMemory(); !bytes.Equal(got, wantMemory) {\n\t\tt.Fatal("checkpoint did not restore memory")\n\t}\n',
              '\tgotMemory := make([]byte, AddressSpaceSize)\n\te.PeekInto(0, gotMemory)\n\tif !bytes.Equal(gotMemory, wantMemory) {\n\t\tt.Fatal("checkpoint did not restore memory")\n\t}\n',
          )
          p.write_text(s)
          PY
      - name: format
        run: gofmt -w internal/ppu/ppu.go internal/ppu/output.go internal/gameboy/options.go pkg/gomeboy/gomeboy.go pkg/gomeboy/checkpoint.go pkg/gomeboy/perf_features_test.go pkg/gomeboy/perf_bench_test.go
      - name: focused tests
        run: go test ./pkg/gomeboy ./internal/ppu
      - name: regression tests
        run: go test -tags test ./tests -run Test_Regressions
      - name: performance benchmarks
        run: go test ./pkg/gomeboy -run '^$' -bench '^(BenchmarkPerfStepFrameHeadless|BenchmarkPerfStepFrameHeadlessNoVideo|BenchmarkPerfStepFrames60Headless|BenchmarkPerfStepFrames60HeadlessNoVideo|BenchmarkPerfCheckpointRoundTrip|BenchmarkPerfSaveStateRoundTrip|BenchmarkPerfReadInto4K)$' -benchmem -benchtime=1s -count=5
      - name: commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'implementation already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/ppu/ppu.go internal/ppu/output.go internal/gameboy/options.go pkg/gomeboy/gomeboy.go pkg/gomeboy/checkpoint.go pkg/gomeboy/perf_features_test.go pkg/gomeboy/perf_bench_test.go README.md
          git commit -m 'perf: add video-free stepping and fast checkpoints'
          git push origin HEAD:perf/video-checkpoints

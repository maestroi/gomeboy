name: publish v1.4.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.4.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v1.4.0
      - name: setup go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
      - name: install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc libgl1-mesa-dev libegl-dev xorg-dev libsdl2-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: build
        run: |
          go build -trimpath -ldflags="-s -w" -o gomeboy-linux-amd64 .
          go build -trimpath -ldflags="-s -w" -o gomeboy-stream-linux-amd64 ./cmd/gomeboy-stream
          go build -trimpath -ldflags="-s -w" -o gomeboy-link-broker-linux-amd64 ./cmd/gomeboy-link-broker
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          files: |
            gomeboy-linux-amd64
            gomeboy-stream-linux-amd64
            gomeboy-link-broker-linux-amd64
          body_path: .github/releases/v1.4.0.md
          generate_release_notes: true

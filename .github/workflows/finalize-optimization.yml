name: finalize core optimizations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'perf/headless-core-optimizations'
    runs-on: ubuntu-latest
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: harden scheduler and headless toggle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sched = Path('internal/scheduler/scheduler.go')
          text = sched.read_text()
          old = "\t\tevent := s.root\n\t\tfor event != nil {\n\t\t\tif event.eventType <= PPUHandleOffscreenLine {"
          new = "\t\tevent := s.root\n\t\tfor event != nil && event.cycle != math.MaxUint64 {\n\t\t\tif event.eventType <= PPUHandleOffscreenLine {"
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 ChangeSpeed loops, found {text.count(old)}')
          sched.write_text(text.replace(old, new, 2))
          apu = Path('internal/apu/apu.go')
          text = apu.read_text()
          old = "\tif a.buffer == nil {\n\t\ta.buffer = make([]float32, bufferSize)\n\t}\n\ta.s.ScheduleEvent(scheduler.APUSample, samplePeriod)"
          new = "\tif a.buffer == nil {\n\t\ta.buffer = make([]float32, bufferSize)\n\t}\n\t// Be defensive when loading save states created before headless mode\n\t// stopped scheduling output samples.\n\ta.s.DescheduleEvent(scheduler.APUSample)\n\ta.s.ScheduleEvent(scheduler.APUSample, samplePeriod)"
          if text.count(old) != 1:
              raise SystemExit(f'expected SetHeadless resume path once, found {text.count(old)}')
          apu.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/scheduler/scheduler.go internal/apu/apu.go internal/scheduler/change_speed_regression_test.go
      - name: verify fixes
        run: |
          go test ./internal/scheduler -run '^(TestDescheduleRootUpdatesNextEvent|TestDescheduleDoesNotRemoveSentinel|TestChangeSpeedReschedulesAllAffectedEvents)$'
          go test ./internal/apu -run '^(TestHighPassStateIsPerAPU|TestHeadlessRemovesOutputSamplingEvent)$'
          go test ./pkg/gomeboy -run '^(TestPerfStepFramesMatchesRepeatedStep|TestPerfPeekIntoMatchesPeek8)$'
      - name: commit final source
        run: |
          rm .github/workflows/finalize-optimization.yml
          git config user.name 'gomeboy perf bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden scheduler rescheduling invariants'
          git push origin HEAD:${{ github.head_ref }}
